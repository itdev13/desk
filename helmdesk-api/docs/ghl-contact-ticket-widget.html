<!--
  HelmDesk — "Ticket View" button + modal for the GoHighLevel CONTACT DETAIL and CONVERSATIONS pages.

  Paste the whole <script> block below into the GHL Marketplace app's Custom JS ("Ticket View").
  It adds a "Tickets" button next to the contact's actions; clicking it opens a modal that:
    • lists that contact's HelmDesk tickets (portal-form submissions with every field they filled),
    • lets an agent change a ticket's STATUS,
    • lets an agent CREATE a new ticket for the contact ("+ New ticket"),
    • deep-links to open the full ticket inside the HelmDesk app.

  The API verifies the contact belongs to the location (via the location's OAuth token) before
  returning anything, so no secret key is needed in this page. All ticket HTML is rendered
  server-side, so new form field types never require a change to this script.

  TWO THINGS TO SET: API_BASE (your HelmDesk API host) and CUSTOM_PAGE_ID (your HelmDesk custom-page id).
-->
<script>
(function () {
  // ===== CONFIG =====
  var API_BASE = 'https://helmdeskapi.vaultsuite.store'; // HelmDesk API host (no trailing slash)
  // Your HelmDesk custom-page id in GHL (from the page URL: /custom-page-link/<THIS>). When set, each
  // ticket gets an "Open full ticket →" button that deep-links into the app (?open=<ticketId>). Leave
  // empty to hide that button.
  var CUSTOM_PAGE_ID = '6a42c684165d1f3e1eb4a5f0';
  // ==================

  var BTN_ID = 'hd-ticket-btn';
  var MODAL_ID = 'hd-ticket-modal';
  var CONTACT_LINK_SEL = 'a[aria-label="View contact details"][href*="/contacts/detail/"]';
  var TICKET_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a3 3 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a3 3 0 0 0 0-6z"/>' +
      '<path d="M14 5v2M14 11v2M14 17v2"/>' +
    '</svg>';

  function idFromPath(p) {
    var m = (p || '').match(/\/contacts\/detail\/([^/?#]+)/);
    return m ? m[1] : null;
  }
  // Contact page: id is in the URL. Conversations page: read it from the "View contact details" link.
  function getContactId() {
    var id = idFromPath(location.pathname);
    if (id) return id;
    var a = document.querySelector(CONTACT_LINK_SEL);
    return a ? idFromPath(a.getAttribute('href')) : null;
  }
  // locationId is always in the URL on both pages: /v2/location/<locationId>/...
  function getLocationId() {
    var m = location.pathname.match(/\/location\/([^/?#]+)/);
    return m ? m[1] : null;
  }
  // Contact page: before the delete icon. Conversations page: before the open-contact icon.
  function getAnchor() {
    return document.getElementById('delete-contact-trigger') ||
           document.querySelector(CONTACT_LINK_SEL);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function injectStyles() {
    if (document.getElementById('hd-ticket-styles')) return;
    var s = document.createElement('style');
    s.id = 'hd-ticket-styles';
    s.textContent = [
      '#' + BTN_ID + '{display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;padding:0;box-sizing:border-box;',
      'color:#422006;background:#E0A24A;border:1px solid #c98a30;border-radius:6px;cursor:pointer;flex-shrink:0}',
      '#' + BTN_ID + ' svg{width:16px;height:16px}',
      '#' + BTN_ID + ':hover{filter:brightness(1.04)}',
      '#' + MODAL_ID + '{position:fixed;inset:0;background:rgba(15,23,41,.45);backdrop-filter:blur(2px);display:flex;',
      'align-items:center;justify-content:center;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}',
      '#' + MODAL_ID + ' .hd-box{background:#fff;border-radius:14px;width:600px;max-width:calc(100vw - 32px);max-height:85vh;',
      'display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}',
      '#' + MODAL_ID + ' .hd-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;',
      'border-bottom:1px solid #eef0f4;flex:none}',
      '#' + MODAL_ID + ' .hd-head h3{margin:0;font-size:16px;font-weight:700;color:#101828}',
      '#' + MODAL_ID + ' .hd-head .hd-sub{font-size:12.5px;color:#667085;margin-top:2px}',
      '#' + MODAL_ID + ' .hd-close{background:none;border:none;font-size:22px;cursor:pointer;color:#98a2b3;line-height:1}',
      '#' + MODAL_ID + ' .hd-body{padding:16px 20px;overflow:auto;font-size:14px;color:#344054;background:#fbfbfc}',
      '#' + MODAL_ID + ' .hd-empty{text-align:center;color:#667085;padding:28px 10px}',
      '#' + MODAL_ID + ' .hd-err{color:#d92d20}'
    ].join('');
    document.head.appendChild(s);
  }

  function escHandler(e) { if (e.key === 'Escape') closeModal(); }
  function closeModal() {
    var m = document.getElementById(MODAL_ID);
    if (m) m.remove();
    document.removeEventListener('keydown', escHandler);
  }

  // The SERVER renders the ticket list HTML (so new form field types never require a script change).
  // This injects it, sets the white-label title, and wires the editable controls (status + create +
  // deep link).
  function renderTickets(body, data, ctx) {
    var contact = data.contact || {};
    var count = (data.tickets || []).length;
    var brand = data.brandName || 'Support';
    var titleEl = document.querySelector('#' + MODAL_ID + ' .hd-title');
    if (titleEl) titleEl.textContent = brand + ' — Tickets';
    var sub = document.querySelector('#' + MODAL_ID + ' .hd-sub');
    if (sub) sub.textContent = (contact.name || 'Contact') + (count ? (' · ' + count + ' ticket' + (count === 1 ? '' : 's')) : '');
    body.innerHTML = data.html || '<div class="hd-empty">No tickets for this contact yet.</div>';

    // Wire each status <select> to save on change (one of the editable controls in the modal).
    body.querySelectorAll('.hd-status').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var ticketId = sel.getAttribute('data-ticket');
        var prev = sel.getAttribute('data-prev');
        var next = sel.value;
        sel.disabled = true;
        fetch(ctx.base + '/api/contact-tickets/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ locationId: ctx.locationId, contactId: ctx.contactId, ticketId: ticketId, status: next })
        })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.success === false) throw new Error((j && j.error) || 'Failed'); return j; }); })
          .then(function () { sel.setAttribute('data-prev', next); sel.disabled = false; })
          .catch(function () { sel.value = prev; sel.disabled = false; alert('Could not update status. Please try again.'); });
      });
    });

    // "Open full ticket →" deep links into the HelmDesk custom page with ?open=<ticketId>. Only shown
    // when CUSTOM_PAGE_ID is configured and we can read the current GHL origin/location.
    if (CUSTOM_PAGE_ID && ctx.locationId) {
      var origin = (function () {
        try { return (window.top && window.top.location && window.top.location.origin) || location.origin; }
        catch (_) { return location.origin; } // cross-origin parent → fall back to our own origin
      })();
      var pageUrl = origin + '/v2/location/' + encodeURIComponent(ctx.locationId) +
        '/custom-page-link/' + encodeURIComponent(CUSTOM_PAGE_ID);
      body.querySelectorAll('.hd-open').forEach(function (btn) {
        btn.style.display = 'inline-flex';
        btn.addEventListener('click', function () {
          var tid = btn.getAttribute('data-open-ticket');
          var href = pageUrl + '?open=' + encodeURIComponent(tid);
          try { window.top.location.href = href; } catch (_) { window.open(href, '_blank', 'noopener'); }
        });
      });
    }

    // "+ New ticket" — toggle the server-rendered create form and submit it to the create endpoint.
    var newBtn = body.querySelector('.hd-new-btn');
    var form = body.querySelector('.hd-new-form');
    if (newBtn && form) {
      newBtn.addEventListener('click', function () {
        var open = form.style.display !== 'none';
        form.style.display = open ? 'none' : 'block';
        if (!open) { var s = form.querySelector('.hd-f-subject'); if (s) s.focus(); }
      });
      var cancel = form.querySelector('.hd-new-cancel');
      if (cancel) cancel.addEventListener('click', function () { form.style.display = 'none'; });
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var subject = (form.querySelector('.hd-f-subject') || {}).value || '';
        var message = (form.querySelector('.hd-f-message') || {}).value || '';
        var priority = (form.querySelector('.hd-f-priority') || {}).value || 'normal';
        if (!subject.trim()) { alert('Please enter a subject.'); return; }
        var submitBtn = form.querySelector('.hd-new-submit');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Creating…'; }
        fetch(ctx.base + '/api/contact-tickets/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ locationId: ctx.locationId, contactId: ctx.contactId, subject: subject, message: message, priority: priority })
        })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.success === false) throw new Error((j && j.error) || 'Failed'); return j; }); })
          .then(function () { reloadModal(body, ctx); }) // refresh the list so the new ticket shows
          .catch(function (err) {
            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Create ticket'; }
            alert('Could not create ticket: ' + (err.message || 'please try again.'));
          });
      });
    }
  }

  // Re-fetch the contact's tickets and re-render the modal body (used after creating a ticket).
  function reloadModal(body, ctx) {
    body.innerHTML = 'Loading…';
    var url = ctx.base + '/api/contact-tickets?locationId=' +
      encodeURIComponent(ctx.locationId) + '&contactId=' + encodeURIComponent(ctx.contactId);
    fetch(url, { method: 'GET' })
      .then(function (r) { return r.text().then(function (tx) { var j; try { j = JSON.parse(tx); } catch (_) { j = null; } if (!r.ok || !j || j.success === false) throw new Error((j && j.error) || ('HTTP ' + r.status)); return j; }); })
      .then(function (data) { if (document.getElementById(MODAL_ID)) renderTickets(body, data, ctx); })
      .catch(function (err) { if (document.getElementById(MODAL_ID)) body.innerHTML = '<div class="hd-err">Failed to reload: ' + esc(err.message) + '</div>'; });
  }

  function openModal() {
    closeModal();
    var contactId = getContactId(); // read at click time → always the contact currently open
    var locationId = getLocationId();

    var modal = document.createElement('div');
    modal.id = MODAL_ID;
    modal.innerHTML =
      '<div class="hd-box">' +
        '<div class="hd-head"><div><h3 class="hd-title">Tickets</h3><div class="hd-sub">Loading…</div></div>' +
          '<button class="hd-close" aria-label="Close">&times;</button></div>' +
        '<div class="hd-body">Loading…</div>' +
      '</div>';
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    modal.querySelector('.hd-close').addEventListener('click', closeModal);
    document.addEventListener('keydown', escHandler);
    document.body.appendChild(modal);

    var body = modal.querySelector('.hd-body');
    if (!contactId || !locationId) { body.innerHTML = '<div class="hd-err">Could not read contact/location from the page.</div>'; return; }

    var base = API_BASE.replace(/\/$/, '');
    var ctx = { base: base, locationId: locationId, contactId: contactId };
    reloadModal(body, ctx);
  }

  function injectButton() {
    var anchor = getAnchor();
    var existing = document.getElementById(BTN_ID);
    if (!anchor || !anchor.parentElement || !getContactId()) {
      if (existing) existing.remove();
      return;
    }
    if (existing && existing.nextElementSibling === anchor) return; // already in place
    if (existing) existing.remove();
    var btn = document.createElement('button');
    btn.id = BTN_ID;
    btn.type = 'button';
    btn.title = 'Support tickets';
    btn.setAttribute('aria-label', 'Support tickets');
    btn.innerHTML = TICKET_ICON;
    btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); openModal(); });
    anchor.parentElement.insertBefore(btn, anchor);
  }

  injectStyles();
  var pending = false;
  new MutationObserver(function () {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; injectButton(); });
  }).observe(document.body, { childList: true, subtree: true });
  injectButton();
})();
</script>
